[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cogworks-week3-language-benchmark"
version = "0.1.0"
description = "CogWorks Week 3 language benchmark: caption-to-image retrieval scored by the portal controller"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8,<3.13"
dependencies = [
    "numpy>=1.24,<2",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
# gensim is only needed by Resources.load_glove(), a convenience for student
# adapters and staff tooling; the controller scoring path is pure numpy.
glove = ["gensim>=4.3,<4.4"]
test = ["pytest>=7,<9", "ruff>=0.4,<1"]

[project.entry-points."cogworks.benchmarks.v2"]
language-search = "language_search_benchmark.plugins:LanguageSearchBenchmark"

[tool.setuptools.packages.find]
include = ["language_search_benchmark*"]

[tool.setuptools.package-data]
language_search_benchmark = ["manifests/*.json", "py.typed"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# Explicit so user-level ruff configs cannot change what CI enforces.
# Correctness families only; the py3.8-compatible typing spellings are
# deliberate, so the modernization (UP) family stays off.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B904"]
